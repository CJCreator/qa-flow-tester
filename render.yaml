# Publishes the whole app (the runner and the wizard) online on Render's free plan, as a shared
# beta copy: each visitor adds their own AI key, which is kept in memory for their session only,
# and only public sites can be checked. See docs/adr/0012-hosted-runner-github-actions.md.
#
# Free plan limits (Render, checked 2026-10-05): 512 MB RAM and a shared CPU, 750 instance hours a
# month, asleep after 15 minutes without a visit (about a minute to wake), no card needed.
services:
  - type: web
    name: qa-check-up
    runtime: docker
    plan: free
    dockerfilePath: ./packages/runner/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Build only after the GitHub checks on the commit pass (the Deploy workflow's tests), not on every push.
    autoDeployTrigger: checksPass
    envVars:
      - key: RUNNER_BETA
        value: '1'
      - key: RUNNER_HOST
        value: 0.0.0.0
      # Required: the runner refuses to start on 0.0.0.0 without it. Set it in the Render dashboard
      # (never in this file); open the copy once with /?access=<key> to set the cookie.
      - key: RUNNER_ACCESS_TOKEN
        sync: false
