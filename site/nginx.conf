server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers. nginx drops server-level add_header once a location sets its own, so each location repeats them.
  # `always` sends them on error pages too.
  #
  # CSP is Report-Only until the built wizard and /sample-report.html are checked in a browser: the landing page
  # frames /sample-report.html, and its inline content could not be inspected here. Violations are reported, not blocked.
  # connect-src names the online copy (VITE_ONLINE_APP_URL in .github/workflows/deploy.yml); change both together.
  # Helper sign-in (Firebase) is not allowed here: the site build sets no VITE_FIREBASE_* values, so it is off on the site.
  # X-Frame-Options is SAMEORIGIN, not DENY, and frame-ancestors is 'self': the landing page frames /sample-report.html.

  # Build output is named by content hash, so it can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://qa-check-up-809804736896.us-central1.run.app; frame-src 'self'; worker-src 'self' blob:; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    try_files $uri =404;
  }

  # Every other path is the single-page app: unknown paths get index.html (what vercel.json did).
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://qa-check-up-809804736896.us-central1.run.app; frame-src 'self'; worker-src 'self' blob:; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
