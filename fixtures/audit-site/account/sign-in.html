<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in | Kaveri Sweets</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/wp-content/themes/kaveri/style.css" />
  </head>
  <body>
    <main>
      <form class="sign-in" action="/account/sign-in" method="post">
        <h1>Sign in</h1>
        <label for="user-login">Email or username</label>
        <input id="user-login" name="log" type="text" autocomplete="username" required />
        <label for="user-pass">Password</label>
        <input id="user-pass" name="pwd" type="password" autocomplete="current-password" required />
        <p><button type="submit">Sign in</button></p>
      </form>
    </main>
  </body>
</html>
