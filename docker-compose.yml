services:
  qa-runner:
    build:
      context: .
      dockerfile: packages/runner/Dockerfile
    container_name: qa-tool-runner
    restart: unless-stopped
    # 512MB shared memory prevents headless Chromium crashes on complex DOMs
    shm_size: "512m"
    ports:
      - "3001:3001"
    environment:
      - RUNNER_HOST=0.0.0.0
      - RUNNER_PORT=3001
      - RUNNER_ACCESS_TOKEN=${RUNNER_ACCESS_TOKEN:-qa-local-secret-token}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - NODE_OPTIONS=--max-old-space-size=384
    volumes:
      - qa-data:/data
    # Resource constraints for low-cost small container execution
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  qa-data:
