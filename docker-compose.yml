services:
  runner:
    build:
      context: .
      dockerfile: packages/runner/Dockerfile
      args:
        VITE_COUNTER_URL: ${VITE_COUNTER_URL:-}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    container_name: qa-flow-tester-runner
    restart: unless-stopped
    # The container is the only wall around Chromium (it runs with --no-sandbox, see packages/runner/Dockerfile), so
    # it gets no extra rights and a memory ceiling like the hosted copy's 2 GiB.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    ports:
      - '${RUNNER_PORT:-3001}:3001'
    environment:
      - NODE_ENV=production
      - RUNNER_HOST=0.0.0.0
      - RUNNER_PORT=3001
      - RUNNER_ACCESS_TOKEN=${RUNNER_ACCESS_TOKEN:?RUNNER_ACCESS_TOKEN is required when binding to 0.0.0.0}
      - RUNNER_DATA_DIR=/data
      - RUNNER_OUTPUT_DIR=/data/reports
      - RUNNER_ALLOWED_ORIGINS=${RUNNER_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3001}
      - RUNNER_BETA=${RUNNER_BETA:-0}
      - QA_AI_PROVIDER=${QA_AI_PROVIDER:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - qa-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3001/healthz'').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  site:
    build:
      context: .
      dockerfile: site/Dockerfile
    container_name: qa-flow-tester-site
    restart: unless-stopped
    ports:
      - '${SITE_PORT:-8080}:8080'
    depends_on:
      runner:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8080/ > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  qa-data:
    name: qa-flow-tester-data
