version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: qa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qahub_secret}
      POSTGRES_DB: ${POSTGRES_DB:-qa_hub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qahub} -d ${POSTGRES_DB:-qa_hub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: qa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: qa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET:-qa-evidence};
      /usr/bin/mc anonymous set download local/${S3_BUCKET:-qa-evidence};
      echo 'MinIO bucket [${S3_BUCKET:-qa-evidence}] provisioned successfully';
      exit 0;
      "

  hub-api:
    build:
      context: .
      dockerfile: packages/hub/Dockerfile
    container_name: qa-hub-api
    restart: unless-stopped
    ports:
      - "${HUB_PORT:-4000}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-qahub}:${POSTGRES_PASSWORD:-qahub_secret}@postgres:5432/${POSTGRES_DB:-qa_hub}?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-qa-evidence}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/qa-evidence}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Release check-up at http://localhost:3001: the Wizard at /, and the API that runs check-ups. `localhost` in a target address is rewritten to host.docker.internal, so
  # products running on your own machine can still be reached.
  runner:
    build:
      context: .
      dockerfile: packages/runner/Dockerfile
    container_name: qa-runner
    restart: unless-stopped
    ports:
      - "${RUNNER_PORT:-3001}:3001"
    environment:
      RUNNER_LOCALHOST_ALIAS: host.docker.internal
      # The Report Hub's dashboard is passed on at /hub, and its API at /api/v1/, on this port
      HUB_API_URL: http://hub-api:4000
      # Optional: skip the wizard's key step by providing the key here instead
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 1gb
    volumes:
      - runner_data:/data

volumes:
  postgres_data:
    name: qa_postgres_data
  minio_data:
    name: qa_minio_data
  runner_data:
    name: qa_runner_data
