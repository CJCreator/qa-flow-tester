version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Playwright is bumped by hand, in the npm lockfile, the runner Dockerfile and the image tag together.
    # Dependabot would open one of them alone, and the Playwright version check then fails
    # (docs/DEPLOYMENT.md#docker).
    ignore:
      - dependency-name: 'playwright'
      - dependency-name: 'playwright-core'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /packages/runner
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'
    ignore:
      - dependency-name: 'mcr.microsoft.com/playwright'
  - package-ecosystem: docker
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'
