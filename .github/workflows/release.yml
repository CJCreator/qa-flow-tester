# Builds the tagged version. No publish step, no secrets: it only proves the tag builds.
name: Release build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi

      - name: Playwright version matches the Docker image tag
        run: node scripts/check-playwright-version.mjs

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build the site
        run: pnpm run site-build

      - name: Build the runner and the packages it uses
        run: pnpm --filter "@qa/runner..." run build

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Chromium (the browser tests drive it)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @qa/core exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @qa/core exec playwright install-deps chromium

      - name: Tests
        run: pnpm exec vitest run --exclude "**/wizard-e2e.test.ts"

      - name: Build
        run: pnpm build
