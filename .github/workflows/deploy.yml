# Every push to main is built, then deployed to Google Cloud Run (ADR 0032). Tests run on your machine, not here:
#   - the runner: the full app, the shared online copy behind its access key (service qa-check-up)
#   - the site: the landing page and the wizard, public (service qa-check-up-site)
#
# Both deploys wait for the build. Each one verifies its own service after deploying.
# Sign-in is keyless (Workload Identity Federation); the runner's access key is read from Secret Manager.
#
# Settings used (Settings > Secrets and variables > Actions > Variables):
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer push waits for the running deploy to finish. It does not cancel it: a cancelled
# run can stop after a new revision goes live and before it is verified.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Run JavaScript actions on Node 24 now, ahead of GitHub retiring Node 20 for them.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GCP_PROJECT: qa-flow-tester-512310
  GCP_REGION: us-central1
  # A Cloud Run service's address is fixed: <service>-<project number>.<region>.run.app.
  RUNNER_URL: https://qa-check-up-809804736896.us-central1.run.app
  SITE_URL: https://qa-check-up-site-809804736896.us-central1.run.app

jobs:
  build:
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version matches the Docker image tag
        run: node scripts/check-playwright-version.mjs

      # The site. The wizard's "Open the online app" button points at the runner.
      - name: Build the site
        env:
          VITE_ONLINE_APP_URL: ${{ env.RUNNER_URL }}
        run: pnpm run site-build

      # The same build the runner's image runs. It compiles the runner and the packages it uses, which also type-checks them.
      - name: Build the runner
        run: pnpm --filter "@qa/runner..." run build

      - name: Smoke check
        run: pnpm run smoke

      - name: Keep the built site for the site deploy
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 1

  deploy-runner:
    needs: [build]
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # packages/runner/Dockerfile, tagged with this commit.
      - name: Build and push the runner image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/qa/runner:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -f packages/runner/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Cloud Run's root filesystem is read-only except /tmp, so data goes there.
      # The access key is read from Secret Manager, never written into this file.
      - name: Deploy the runner
        run: |
          gcloud run deploy qa-check-up --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "$IMAGE" --port 8080 --memory 2Gi --cpu 1 \
            --min-instances 0 --max-instances 1 --timeout 3600 \
            --allow-unauthenticated --quiet \
            --set-env-vars "RUNNER_BETA=1,RUNNER_HOST=0.0.0.0,RUNNER_DATA_DIR=/tmp/qa-data,RUNNER_OUTPUT_DIR=/tmp/qa-data/reports,RUNNER_ALLOWED_ORIGINS=$RUNNER_URL" \
            --set-secrets "RUNNER_ACCESS_TOKEN=qa-access-token:latest"

      # Cloud Run's front end answers /healthz itself and never reaches the container, so the check uses the root.
      # The runner answers it with 401 (its access-key gate): that proves the container is serving.
      - name: Verify the runner answers
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$RUNNER_URL/") || code=000
            echo "attempt $attempt: $code"
            { [ "$code" = "401" ] || [ "$code" = "200" ]; } && exit 0
            sleep 10
          done
          exit 1

  deploy-site:
    needs: [build]
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Get the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the site image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/qa/site:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -f site/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy the site
        run: |
          gcloud run deploy qa-check-up-site --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "$IMAGE" --port 8080 --memory 256Mi --cpu 1 \
            --min-instances 0 --max-instances 2 \
            --allow-unauthenticated --quiet

      # version.json names the commit the site was built from, so an old image cannot pass.
      - name: Verify the site serves this commit
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -s -m 10 "$SITE_URL/version.json") || body=""
            echo "attempt $attempt: $body"
            echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\"" && exit 0
            sleep 10
          done
          exit 1
