# Every push to main is tested, then published to Google Cloud Run: the runner (the full app, shared online
# copy) and the static site (landing page and wizard). Render and Vercel are retired (docs/adr/0032).
# A manual run (Actions > Deploy > Run workflow) can tick "skip_tests" to deploy after build-and-smoke only.
#
# Auth is keyless (Workload Identity Federation): no key lives in GitHub.
#
# Set once (Settings > Secrets and variables > Actions > Variables), already done:
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT
# Optional variables for Website Audits on the hosted copy (docs/DEPLOYMENT.md, "Website Audit storage and Helper sign-in"):
#   AUDIT_STORE_BUCKET, FIREBASE_PROJECT_ID, FIREBASE_WEB_API_KEY, FIREBASE_AUTH_DOMAIN, AUDIT_OWNER_EMAILS
# Optional variable for scheduled Check-ups on the hosted copy (docs/DEPLOYMENT.md, "Scheduled Check-ups on the hosted copy"):
#   SCHEDULER_SERVICE_ACCOUNT
# The runner's access token is in Secret Manager as qa-access-token.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip the test suite and deploy after build-and-smoke (lint, build, smoke check) only'
        type: boolean
        default: false

# One deploy at a time. A push while a deploy is running waits for it: cancelling mid-rollout could leave the runner
# and the site on different commits. GitHub keeps only the newest waiting run, so the latest commit still goes out.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Run JavaScript actions on Node 24 now, ahead of GitHub retiring Node 20 for them.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GCP_PROJECT: qa-flow-tester-512310
  GCP_REGION: us-central1
  # Cloud Run's address is fixed per service: <service>-<project number>.<region>.run.app.
  RUNNER_URL: https://qa-check-up-809804736896.us-central1.run.app
  SITE_URL: https://qa-check-up-site-809804736896.us-central1.run.app

jobs:
  build-and-smoke:
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Builds run out of memory at the default Node heap.
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version matches the Docker image tag
        run: node scripts/check-playwright-version.mjs

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # The static site. The wizard's "Open the online app" button points at the runner.
      - name: Build the site
        env:
          VITE_ONLINE_APP_URL: ${{ env.RUNNER_URL }}
        run: pnpm run site-build

      # The same build the runner's image runs. It compiles the runner and the packages it uses, which also type-checks them.
      - name: Build the runner
        run: pnpm --filter "@qa/runner..." run build

      # Fast production smoke check: boots the app on a test port and verifies the Wizard and API endpoints
      - name: Smoke check
        run: pnpm run smoke

      - name: Keep the built site for the site job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: public
          retention-days: 1

  # The unit tests, the same shards a pull request runs (see tests.yml). Nothing reaches the
  # Cloud Run deploys without passing them, unless a manual run ticked skip_tests. On a push,
  # inputs.skip_tests is empty, so the tests always run.
  test:
    if: github.repository == 'CJCreator/qa-flow-tester' && !inputs.skip_tests
    strategy:
      fail-fast: true
      matrix:
        shard: ['1/2', '2/2']
    uses: ./.github/workflows/tests.yml
    with:
      project: unit
      shard: ${{ matrix.shard }}

  # Blocks the deploy on a finding.
  audit:
    if: github.repository == 'CJCreator/qa-flow-tester'
    uses: ./.github/workflows/audit.yml

  # Blocks the deploy on a finding.
  secret-scan:
    if: github.repository == 'CJCreator/qa-flow-tester'
    uses: ./.github/workflows/secret-scan.yml

  # The runner: the full app, behind its access key (RUNNER_ACCESS_TOKEN from Secret Manager).
  # A skipped job normally skips everything that needs it, so the deploys check the results themselves:
  # build-and-smoke, audit and secret-scan must pass, and test must pass or have been skipped on purpose (skip_tests).
  cloud-run:
    needs: [build-and-smoke, test, audit, secret-scan]
    if: >-
      ${{ !cancelled() && github.repository == 'CJCreator/qa-flow-tester' &&
      needs.build-and-smoke.result == 'success' &&
      needs.audit.result == 'success' && needs.secret-scan.result == 'success' &&
      (needs.test.result == 'success' || (inputs.skip_tests && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: qa-check-up
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Build the runner image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/qa/runner:$GITHUB_SHA"
          docker build --build-arg QA_TOOL_SHA="$GITHUB_SHA" -f packages/runner/Dockerfile -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # The same scan CI runs (ci.yml, build-secret-scan): the files in the image, its environment and build history.
      - name: Scan the runner image for AI keys
        run: |
          out="$RUNNER_TEMP/runner-image"
          mkdir -p "$out"
          id=$(docker create "$IMAGE")
          docker cp "$id:/app" "$out/app"
          docker rm "$id" > /dev/null
          docker image inspect "$IMAGE" > "$out/image-config.json"
          docker history --no-trunc "$IMAGE" > "$out/image-history.txt"
          node scripts/scan-build-secrets.mjs "$out"

      - name: Push the runner image
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"

      # Cloud Run's root filesystem is read-only except /tmp, so data goes there (the image's /data is not writable).
      # The access token is read from Secret Manager, never from this file.
      # Website Audits and Shared Links live in the AUDIT_STORE_BUCKET Cloud Storage bucket (ADR 0036); Helper
      # sign-in uses Firebase Authentication in the same project. Those four and SCHEDULER_SERVICE_ACCOUNT (the
      # Cloud Scheduler service account whose Google token may call the tick route, ADR 0039) are public names from
      # repository variables (docs/DEPLOYMENT.md). An unset variable passes an empty value, which the runner treats as off.
      # gcloud splits --set-env-vars on commas, and RUNNER_ALLOWED_ORIGINS is itself a comma-separated list. The
      # leading ^#^ makes "#" the separator instead (`gcloud topic escaping`), so the origin list stays one value.
      # "#" and not "@" because SCHEDULER_SERVICE_ACCOUNT is an email address. No value may contain "#".
      - name: Deploy to Cloud Run
        env:
          AUDIT_STORE_BUCKET: ${{ vars.AUDIT_STORE_BUCKET }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          SCHEDULER_SERVICE_ACCOUNT: ${{ vars.SCHEDULER_SERVICE_ACCOUNT }}
          AUDIT_OWNER_EMAILS: ${{ vars.AUDIT_OWNER_EMAILS }}
        run: |
          gcloud run deploy "$SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "$IMAGE" --port 8080 --memory 2Gi --cpu 1 \
            --min-instances 1 --max-instances 1 --timeout 3600 \
            --allow-unauthenticated \
            --set-env-vars "^#^RUNNER_BETA=1#RUNNER_HOST=0.0.0.0#RUNNER_DATA_DIR=/tmp/qa-data#RUNNER_OUTPUT_DIR=/tmp/qa-data/reports#RUNNER_ALLOWED_ORIGINS=$RUNNER_URL,https://qa-check-up-cnhl7suwnq-uc.a.run.app#AUDIT_STORE_BUCKET=$AUDIT_STORE_BUCKET#FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID#FIREBASE_WEB_API_KEY=$FIREBASE_WEB_API_KEY#FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN#SCHEDULER_SERVICE_ACCOUNT=$SCHEDULER_SERVICE_ACCOUNT#AUDIT_OWNER_EMAILS=$AUDIT_OWNER_EMAILS" \
            --set-secrets "RUNNER_ACCESS_TOKEN=qa-access-token:latest"

      # Cloud Run's front end answers /healthz with its own 404 and never reaches the container, so this
      # checks the root instead. The runner answers it with 401 (its access-key gate), which proves the
      # container is serving. A 404 or 503 means the request did not reach a running runner.
      - name: Verify the runner answers
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$RUNNER_URL/") || code=000
            echo "attempt $attempt: $code"
            { [ "$code" = "401" ] || [ "$code" = "200" ]; } && exit 0
            sleep 10
          done
          exit 1

  # The static site: the landing page and the wizard, public, served by nginx (site/Dockerfile).
  site:
    needs: [build-and-smoke, test, audit, secret-scan]
    if: >-
      ${{ !cancelled() && github.repository == 'CJCreator/qa-flow-tester' &&
      needs.build-and-smoke.result == 'success' &&
      needs.audit.result == 'success' && needs.secret-scan.result == 'success' &&
      (needs.test.result == 'success' || (inputs.skip_tests && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: qa-check-up-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: public

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Build and push the site image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/qa/site:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -f site/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "$IMAGE" --port 8080 --memory 256Mi --cpu 1 \
            --min-instances 0 --max-instances 2 \
            --allow-unauthenticated

      # version.json names the commit the site was built from, so an old image cannot pass.
      - name: Verify the site serves this commit
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -s -m 10 "$SITE_URL/version.json") || body=""
            echo "attempt $attempt: $body"
            echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\"" && exit 0
            sleep 10
          done
          exit 1
