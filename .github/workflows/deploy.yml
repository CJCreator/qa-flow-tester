# Every push to main is tested, then published to Google Cloud Run: the runner (the full app, shared online
# copy) and the static site (landing page and wizard). Render and Vercel are retired (docs/adr/0032).
#
# Auth is keyless (Workload Identity Federation): no key lives in GitHub.
#
# Set once (Settings > Secrets and variables > Actions > Variables), already done:
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT
# The runner's access token is in Secret Manager as qa-access-token.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. If a new commit is pushed to main while a previous run is in progress,
# the older run is cancelled to immediately deploy the latest code without queuing delays.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Run JavaScript actions on Node 24 now, ahead of GitHub retiring Node 20 for them.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GCP_PROJECT: qa-flow-tester-512310
  GCP_REGION: us-central1
  # Cloud Run's address is fixed per service: <service>-<project number>.<region>.run.app.
  RUNNER_URL: https://qa-check-up-809804736896.us-central1.run.app
  SITE_URL: https://qa-check-up-site-809804736896.us-central1.run.app

jobs:
  build-and-smoke:
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version matches the Docker image tag
        run: node scripts/check-playwright-version.mjs

      - name: Lint
        run: pnpm lint

      # The static site. The wizard's "Open the online app" button points at the runner.
      - name: Build the site
        env:
          VITE_ONLINE_APP_URL: ${{ env.RUNNER_URL }}
        run: pnpm run site-build

      # The same build the runner's image runs. It compiles the runner and the packages it uses, which also type-checks them.
      - name: Build the runner
        run: pnpm --filter "@qa/runner..." run build

      # Fast production smoke check: boots the app on a test port and verifies the Wizard and API endpoints
      - name: Smoke check
        run: pnpm run smoke

      - name: Keep the built site for the site job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 1

  # The full test suite, the same shards a pull request runs (see tests.yml). Nothing reaches the
  # Cloud Run deploys without passing them.
  test:
    if: github.repository == 'CJCreator/qa-flow-tester'
    strategy:
      fail-fast: true
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    uses: ./.github/workflows/tests.yml
    with:
      shard: ${{ matrix.shard }}

  # The runner: the full app, behind its access key (RUNNER_ACCESS_TOKEN from Secret Manager).
  cloud-run:
    needs: [build-and-smoke, test]
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: qa-check-up
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # packages/runner/Dockerfile, tagged with this commit.
      - name: Build and push the runner image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/qa/runner:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -f packages/runner/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Cloud Run's root filesystem is read-only except /tmp, so data goes there (the image's /data is not writable).
      # The access token is read from Secret Manager, never from this file.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "$IMAGE" --port 8080 --memory 2Gi --cpu 1 \
            --min-instances 0 --max-instances 1 --timeout 3600 \
            --allow-unauthenticated \
            --set-env-vars "RUNNER_BETA=1,RUNNER_HOST=0.0.0.0,RUNNER_DATA_DIR=/tmp/qa-data,RUNNER_OUTPUT_DIR=/tmp/qa-data/reports,RUNNER_ALLOWED_ORIGINS=$RUNNER_URL,https://qa-check-up-cnhl7suwnq-uc.a.run.app" \
            --set-secrets "RUNNER_ACCESS_TOKEN=qa-access-token:latest"

      # Cloud Run's front end answers /healthz with its own 404 and never reaches the container, so this
      # checks the root instead. The runner answers it with 401 (its access-key gate), which proves the
      # container is serving. A 404 or 503 means the request did not reach a running runner.
      - name: Verify the runner answers
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$RUNNER_URL/") || code=000
            echo "attempt $attempt: $code"
            { [ "$code" = "401" ] || [ "$code" = "200" ]; } && exit 0
            sleep 10
          done
          exit 1

  # The static site: the landing page and the wizard, public, served by nginx (site/Dockerfile).
  site:
    needs: [build-and-smoke, test]
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: qa-check-up-site
    steps:
      - uses: actions/checkout@v4

      - name: Get the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the site image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/qa/site:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -f site/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "$IMAGE" --port 8080 --memory 256Mi --cpu 1 \
            --min-instances 0 --max-instances 2 \
            --allow-unauthenticated

      # version.json names the commit the site was built from, so an old image cannot pass.
      - name: Verify the site serves this commit
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -s -m 10 "$SITE_URL/version.json") || body=""
            echo "attempt $attempt: $body"
            echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\"" && exit 0
            sleep 10
          done
          exit 1
