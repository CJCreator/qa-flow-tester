# Direct, fast production deployment to Google Cloud Run: the runner (the full app) and
# the static site (landing page and wizard).
# Tests run on pull requests and commits via ci.yml; this workflow focuses purely on building and publishing.
#
# Auth is keyless (Workload Identity Federation): no key lives in GitHub.
# Variables (Settings > Secrets and variables > Actions > Variables):
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT
# Secret Manager: qa-access-token
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any previous deploy in progress so only the newest commit is built and deployed
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GCP_PROJECT: qa-flow-tester-512310
  GCP_REGION: us-central1
  RUNNER_URL: https://qa-check-up-809804736896.us-central1.run.app
  SITE_URL: https://qa-check-up-site-809804736896.us-central1.run.app

jobs:
  # 1. Deploy the Runner (the full QA engine, behind its access key)
  cloud-run:
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the runner image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/qa/runner:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -f packages/runner/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy qa-check-up --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "$IMAGE" --port 8080 --memory 1Gi --cpu 1 \
            --min-instances 0 --max-instances 1 --timeout 3600 \
            --allow-unauthenticated \
            --set-env-vars "RUNNER_BETA=1,RUNNER_HOST=0.0.0.0,RUNNER_DATA_DIR=/tmp/qa-data,RUNNER_OUTPUT_DIR=/tmp/qa-data/reports,NODE_OPTIONS=--max-old-space-size=384,RUNNER_ALLOWED_ORIGINS=$RUNNER_URL,https://qa-check-up-cnhl7suwnq-uc.a.run.app" \
            --set-secrets "RUNNER_ACCESS_TOKEN=qa-access-token:latest"

      - name: Verify the runner answers
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$RUNNER_URL/") || code=000
            echo "attempt $attempt: $code"
            { [ "$code" = "401" ] || [ "$code" = "200" ]; } && exit 0
            sleep 5
          done
          exit 1

  # 2. Deploy the Static Landing Site & Wizard (served by nginx)
  site:
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build the static site
        env:
          VITE_ONLINE_APP_URL: ${{ env.RUNNER_URL }}
        run: |
          pnpm install --frozen-lockfile --filter "@qa/types..." --filter "@qa/wizard..."
          pnpm run site-build

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the site image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/qa/site:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -f site/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy qa-check-up-site --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --image "$IMAGE" --port 8080 --memory 256Mi --cpu 1 \
            --min-instances 0 --max-instances 2 \
            --allow-unauthenticated

      - name: Verify the site serves this commit
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -s -m 10 "$SITE_URL/version.json") || body=""
            echo "attempt $attempt: $body"
            echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\"" && exit 0
            sleep 5
          done
          exit 1
