# Every push to main is tested, then published: the Vercel site (the landing page) and the Render app
# (the shared online copy) both rebuild without anyone running a command.
#
# How each one gets the new code:
#   - Render builds from this repo (render.yaml sets autoDeploy), so the push itself starts its build.
#   - Vercel builds from the CJCreator-New/flowtester repo, so this workflow copies main there once the
#     tests pass. That push is what starts the Vercel build.
#
# Set up once (Settings > Secrets and variables > Actions):
#   Secret    VERCEL_REPO_TOKEN   a fine-grained personal access token that can write contents and
#                                 workflows on CJCreator-New/flowtester (made by an account that can push there).
#   Variable  VERCEL_SITE_URL     optional, the Vercel address to check (default https://flowtester.vercel.app)
#   Variable  RENDER_APP_URL      optional, the Render address to check (default https://qa-check-up-2q68.onrender.com)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. If a new commit is pushed to main while a previous run is in progress,
# the older run is cancelled to immediately deploy the latest code without queuing delays.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke:
    # The copy of this workflow in the mirror repo does nothing: only the source repo publishes.
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version matches the Docker image tag
        run: node scripts/check-playwright-version.mjs

      - name: Lint
        run: pnpm lint

      # The same build Vercel runs, and the one Render's image runs for the wizard.
      - name: Build the site
        run: pnpm run vercel-build

      # The same build Render's image runs. It compiles the runner and the packages it uses, which also type-checks them.
      - name: Build the runner
        run: pnpm --filter "@qa/runner..." run build

      # Fast production smoke check: boots the app on a test port and verifies the Wizard and API endpoints
      - name: Smoke check
        run: pnpm run smoke

  publish:
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Without this, checkout leaves the built-in github-actions[bot] login in git's config, and it
          # wins over the token below: the push is then made as the bot, which cannot write to the other repo (403).
          persist-credentials: false

      - name: Copy main to the Vercel repo
        env:
          TOKEN: ${{ secrets.VERCEL_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the VERCEL_REPO_TOKEN secret (see the top of this file)."
            exit 1
          fi
          git push "https://x-access-token:${TOKEN}@github.com/CJCreator-New/flowtester.git" HEAD:refs/heads/main

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_SITE_URL: ${{ vars.VERCEL_SITE_URL || 'https://flowtester.vercel.app' }}
      RENDER_APP_URL: ${{ vars.RENDER_APP_URL || 'https://qa-check-up-2q68.onrender.com' }}
    steps:
      # Both builds take a few minutes, and a free Render service sleeps: check both concurrently.
      - name: Verify Vercel and Render deployments concurrently
        run: |
          echo "Verifying Vercel ($VERCEL_SITE_URL) and Render ($RENDER_APP_URL) concurrently..."
          vercel_ready=0
          render_ready=0
          for i in $(seq 1 30); do
            if [ "$vercel_ready" -eq 0 ]; then
              code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$VERCEL_SITE_URL/") || code="000"
              if [ "$code" = "200" ]; then
                echo "Vercel ready (200 OK) on attempt $i"
                vercel_ready=1
              fi
            fi
            if [ "$render_ready" -eq 0 ]; then
              code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$RENDER_APP_URL/healthz") || code="000"
              if [ "$code" = "200" ]; then
                echo "Render ready (200 OK) on attempt $i"
                render_ready=1
              fi
            fi
            if [ "$vercel_ready" -eq 1 ] && [ "$render_ready" -eq 1 ]; then
              echo "Deployment verification PASSED: Both Vercel and Render are responding with HTTP 200."
              exit 0
            fi
            echo "Attempt $i: Vercel ready=$vercel_ready, Render ready=$render_ready. Waiting 5s..."
            sleep 5
          done
          if [ "$vercel_ready" -ne 1 ]; then
            echo "::error::Vercel site ($VERCEL_SITE_URL) did not become ready in time."
          fi
          if [ "$render_ready" -ne 1 ]; then
            echo "::error::Render app ($RENDER_APP_URL) did not become ready in time."
          fi
          exit 1
