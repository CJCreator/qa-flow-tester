# Every push to main is tested, then published: the Vercel site (the landing page) and the Render app
# (the shared online copy) both rebuild without anyone running a command.
#
# How each one gets the new code:
#   - Render builds from this repo (render.yaml sets autoDeployTrigger: checksPass), so it builds a commit only
#     after that commit's checks, including the tests below, have passed.
#   - Vercel builds from the CJCreator-New/flowtester repo, so this workflow copies main there once the
#     tests pass. That push is what starts the Vercel build.
#
# Set up once (Settings > Secrets and variables > Actions):
#   Secret    VERCEL_REPO_TOKEN   a fine-grained personal access token that can write contents and
#                                 workflows on CJCreator-New/flowtester (made by an account that can push there).
#   Variable  VERCEL_SITE_URL     optional, the Vercel address to check (default https://flowtester.vercel.app)
#   Variable  RENDER_APP_URL      optional, the Render address to check (default https://qa-check-up-2q68.onrender.com)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. If a new commit is pushed to main while a previous run is in progress,
# the older run is cancelled to immediately deploy the latest code without queuing delays.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Run JavaScript actions on Node 24 now, ahead of GitHub retiring Node 20 for them.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-smoke:
    # The copy of this workflow in the mirror repo does nothing: only the source repo publishes.
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version matches the Docker image tag
        run: node scripts/check-playwright-version.mjs

      - name: Lint
        run: pnpm lint

      # The same build Vercel runs, and the one Render's image runs for the wizard.
      - name: Build the site
        run: pnpm run vercel-build

      # The same build Render's image runs. It compiles the runner and the packages it uses, which also type-checks them.
      - name: Build the runner
        run: pnpm --filter "@qa/runner..." run build

      # Fast production smoke check: boots the app on a test port and verifies the Wizard and API endpoints
      - name: Smoke check
        run: pnpm run smoke

  # The full test suite, the same shards a pull request runs (see tests.yml). Nothing reaches main's
  # publish step without passing them.
  test:
    if: github.repository == 'CJCreator/qa-flow-tester'
    strategy:
      fail-fast: true
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    uses: ./.github/workflows/tests.yml
    with:
      shard: ${{ matrix.shard }}

  # The same audit and secret scan as ci.yml (a workflow cannot `needs` a job in another workflow).
  audit:
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  secret-scan:
    if: github.repository == 'CJCreator/qa-flow-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "${base}/${tarball}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .'

  publish:
    needs: [build-and-smoke, test, audit, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Without this, checkout leaves the built-in github-actions[bot] login in git's config, and it
          # wins over the token below: the push is then made as the bot, which cannot write to the other repo (403).
          persist-credentials: false

      - name: Copy main to the Vercel repo
        env:
          TOKEN: ${{ secrets.VERCEL_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the VERCEL_REPO_TOKEN secret (see the top of this file)."
            exit 1
          fi
          git push "https://x-access-token:${TOKEN}@github.com/CJCreator-New/flowtester.git" HEAD:refs/heads/main

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_SITE_URL: ${{ vars.VERCEL_SITE_URL || 'https://flowtester.vercel.app' }}
      RENDER_APP_URL: ${{ vars.RENDER_APP_URL || 'https://qa-check-up-2q68.onrender.com' }}
      COMMIT: ${{ github.sha }}
    steps:
      # The Vercel build takes a few minutes, and a free Render service sleeps: poll both for up to 10 minutes.
      # Vercel must serve version.json naming this commit, so an old build cannot pass. Render answers
      # /healthz only, so for Render this step shows the service is up, not which commit it runs.
      - name: Verify Vercel serves this commit and Render is up
        # The loop stops by the clock (10 minutes); this step limit is a backstop below the job's 15 minutes.
        timeout-minutes: 11
        run: |
          echo "Verifying Vercel ($VERCEL_SITE_URL, commit $COMMIT) and Render ($RENDER_APP_URL)..."
          vercel_ready=0
          render_ready=0
          deadline=$(( $(date +%s) + 600 ))
          attempt=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            if [ "$vercel_ready" -eq 0 ]; then
              body=$(curl -s -m 10 "$VERCEL_SITE_URL/version.json") || body=""
              if echo "$body" | grep -q "\"commit\":\"$COMMIT\""; then
                echo "Vercel serves this commit on attempt $attempt"
                vercel_ready=1
              fi
            fi
            if [ "$render_ready" -eq 0 ]; then
              code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$RENDER_APP_URL/healthz") || code="000"
              if [ "$code" = "200" ]; then
                echo "Render ready (200 OK) on attempt $attempt"
                render_ready=1
              fi
            fi
            if [ "$vercel_ready" -eq 1 ] && [ "$render_ready" -eq 1 ]; then
              echo "Deployment verification PASSED."
              exit 0
            fi
            echo "Attempt $attempt: Vercel ready=$vercel_ready, Render ready=$render_ready. Waiting 10s..."
            sleep 10
          done
          echo "Gave up after $attempt attempts (10 minutes)."
          if [ "$vercel_ready" -ne 1 ]; then
            echo "::error::Vercel site ($VERCEL_SITE_URL) does not serve commit $COMMIT in time."
          fi
          if [ "$render_ready" -ne 1 ]; then
            echo "::error::Render app ($RENDER_APP_URL) did not answer /healthz in time."
          fi
          exit 1
