# Runs on every pull request so a broken build or test is caught before main (and the deploy) sees it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast Quality Gate: Surfaces lint, formatting, and typecheck errors in ~30-45 seconds
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version matches the Docker image tag
        run: node scripts/check-playwright-version.mjs

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Blocking: tsc -p tsconfig.test.json --noEmit. A type error fails the job.
      - name: Typecheck
        run: pnpm typecheck

  # Unit tests only (no browser, no fabricated site), 2 shards (see tests.yml). Browser and e2e tests run nightly
  # (e2e-nightly.yml). Deploy runs the unit shards on push to main.
  build-and-test:
    # PRs and manual runs only: a push to main is tested by Deploy before it publishes.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    uses: ./.github/workflows/tests.yml
    with:
      project: unit
      shard: ${{ matrix.shard }}

  # Fails on any high or critical advisory in production dependencies. Reads the lockfile; no install needed.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # Scans the full git history for secrets. Output is redacted; no report is uploaded.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "${base}/${tarball}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .'

  # Scans what ships for AI provider keys (Anthropic, OpenAI, Google AI, OpenRouter): the wizard bundle, and the runner
  # image's /app folder (everything its Dockerfile copies and builds) with the image's environment and build history.
  # Prints the file and pattern name only, never a value.
  build-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the wizard
        run: pnpm --filter @qa/types run build && pnpm --filter @qa/wizard run build

      - name: Scan the wizard bundle
        run: node scripts/scan-build-secrets.mjs packages/wizard/dist

      - name: Build the runner image
        run: docker build -f packages/runner/Dockerfile -t qa-runner:secret-scan .

      - name: Export the runner image's files
        run: |
          out="$RUNNER_TEMP/runner-image"
          mkdir -p "$out"
          id=$(docker create qa-runner:secret-scan)
          docker cp "$id:/app" "$out/app"
          docker rm "$id" > /dev/null
          docker image inspect qa-runner:secret-scan > "$out/image-config.json"
          docker history --no-trunc qa-runner:secret-scan > "$out/image-history.txt"

      - name: Scan the runner image
        run: node scripts/scan-build-secrets.mjs "$RUNNER_TEMP/runner-image"
