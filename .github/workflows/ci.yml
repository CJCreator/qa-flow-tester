# Runs on every pull request so a broken build or test is caught before main (and the deploy) sees it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast Quality Gate: Surfaces lint, formatting, and typecheck errors in ~30-45 seconds
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version matches the Docker image tag
        run: node scripts/check-playwright-version.mjs

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        continue-on-error: true
        run: |
          out=$(pnpm typecheck 2>&1) || true
          echo "$out"
          count=$(echo "$out" | grep -c "error TS" || echo "0")
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### TypeScript Check" >> "$GITHUB_STEP_SUMMARY"
            echo "Typecheck found **$count** error(s)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Full Build & Browser Test Suite: Sharded across 4 parallel runners to complete in ~2-3 minutes instead of 15-20 minutes
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the site (also type-checks types and the wizard)
        run: pnpm run vercel-build

      - name: Build the runner and the packages it uses
        run: pnpm --filter "@qa/runner..." run build

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Chromium (the browser tests drive it)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @qa/core exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @qa/core exec playwright install-deps chromium

      # Every package test run across 4 parallel shards (except wizard-e2e and auth-crawl which is tested in parallel in auth-crawl job).
      # Chromium is installed above for the browser-driven checker and core tests.
      - name: Tests (Shard ${{ matrix.shard }})
        run: pnpm exec vitest run --shard=${{ matrix.shard }} --exclude "**/wizard-e2e.test.ts" --exclude "**/auth-crawl-*.test.ts"

  # Integration tests for authenticated crawls against the fixture app.
  # Runs on PRs touching packages/core, packages/runner, fixtures, or packages/types.
  auth-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/core/**'
              - 'packages/runner/**'
              - 'packages/types/**'
              - 'fixtures/**'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile

      - name: Build the runner and the packages it uses
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm --filter "@qa/runner..." run build

      - name: Cache Playwright browser
        id: playwright-cache
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Chromium
        if: (steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch') && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @qa/core exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: (steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch') && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @qa/core exec playwright install-deps chromium

      - name: Auth and crawl integration tests
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm exec vitest run packages/core/tests/auth-crawl-e2e.test.ts packages/runner/tests/auth-crawl-run.test.ts

  # Fails on any high or critical advisory in production dependencies. Reads the lockfile; no install needed.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # Scans the full git history for secrets. Output is redacted; no report is uploaded.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "${base}/${tarball}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .'
