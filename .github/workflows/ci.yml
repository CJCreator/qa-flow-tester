# Runs on every pull request so a broken build or test is caught before main (and the deploy) sees it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast Quality Gate: Surfaces lint, formatting, and typecheck errors in ~30-45 seconds
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version matches the Docker image tag
        run: node scripts/check-playwright-version.mjs

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Deploy gate wiring: publish waits for every check, and Render builds a commit only after its checks pass.
      # A plain grep, so a removed line fails this PR check.
      - name: Deploy gate is wired
        run: |
          grep -qx '    needs: \[build-and-smoke, test, audit, secret-scan\]' .github/workflows/deploy.yml
          grep -qx '    autoDeployTrigger: checksPass' render.yaml

  # Full test suite, sharded across 4 parallel runners (see tests.yml). Deploy runs the same shards on push to main.
  build-and-test:
    # PRs and manual runs only: a push to main is tested by Deploy before it publishes.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    uses: ./.github/workflows/tests.yml
    with:
      shard: ${{ matrix.shard }}

  # Integration tests for authenticated crawls against the fixture app.
  # Runs on PRs touching packages/core, packages/runner, fixtures, or packages/types.
  auth-crawl:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/core/**'
              - 'packages/runner/**'
              - 'packages/types/**'
              - 'fixtures/**'

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile

      - name: Build the runner and the packages it uses
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm --filter "@qa/runner..." run build

      - name: Cache Playwright browser
        id: playwright-cache
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Chromium
        if: (steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch') && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @qa/core exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: (steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch') && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @qa/core exec playwright install-deps chromium

      - name: Auth and crawl integration tests
        if: steps.filter.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm exec vitest run packages/core/tests/auth-crawl-e2e.test.ts packages/runner/tests/auth-crawl-run.test.ts

  # Fails on any high or critical advisory in production dependencies. Reads the lockfile; no install needed.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # Scans the full git history for secrets. Output is redacted; no report is uploaded.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "${base}/${tarball}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .'
