# One shard of one test project (unit or browser). CI runs unit for every pull request, Deploy runs unit
# before publishing main, and the nightly workflow runs browser.
name: Tests

on:
  workflow_call:
    inputs:
      shard:
        description: 'Which part of the suite to run, as N/M, passed to vitest --shard. Unit runs 1/2 and 2/2; browser runs 1/4 to 4/4.'
        required: true
        type: string
      project:
        description: 'Which vitest project to run: unit or browser. Only browser needs Chromium and the builds.'
        required: false
        default: unit
        type: string

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the site (also type-checks types and the wizard)
        if: inputs.project != 'unit'
        run: pnpm run site-build

      - name: Build the runner and the packages it uses
        if: inputs.project != 'unit'
        run: pnpm --filter "@qa/runner..." run build

      - name: Cache Playwright browser
        if: inputs.project != 'unit'
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Chromium (the browser tests drive it)
        if: inputs.project != 'unit' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @qa/core exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: inputs.project != 'unit' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @qa/core exec playwright install-deps chromium

      - name: Tests (${{ inputs.project }}, shard ${{ inputs.shard }})
        run: pnpm exec vitest run --project ${{ inputs.project }} --shard=${{ inputs.shard }}
