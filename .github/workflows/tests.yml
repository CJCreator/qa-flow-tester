# One shard of the test suite. CI calls it for every pull request, and Deploy calls it before publishing
# main, so a push to main is tested the same way as the pull request it came from.
#
# The shard runs inside Playwright's image, the one the runner image is built on. It already has Chromium and
# the system libraries Chromium needs. Installing those libraries with apt on the runner stalled for minutes and
# timed out the job, so this file does not install anything system-level.
name: Tests

on:
  workflow_call:
    inputs:
      shard:
        description: 'Which part of the suite to run, as N/4 (for example 2/4).'
        required: true
        type: string

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep this tag equal to the Playwright version in pnpm-lock.yaml (scripts/check-playwright-version.mjs).
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Use the pnpm version the runner image uses
        run: corepack enable && corepack prepare pnpm@11.10.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the site (also type-checks types and the wizard)
        run: pnpm run site-build

      - name: Build the runner and the packages it uses
        run: pnpm --filter "@qa/runner..." run build

      # wizard-e2e and auth-crawl run in their own jobs in ci.yml; every other test runs here.
      - name: Tests (shard ${{ inputs.shard }})
        run: pnpm exec vitest run --shard=${{ inputs.shard }} --exclude "**/wizard-e2e.test.ts" --exclude "**/auth-crawl-*.test.ts"
