# Nightly: the browser test project (it never runs on pull requests). Uses tests.yml, which builds the
# site and runner and installs Chromium for it.
name: Nightly E2E

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    uses: ./.github/workflows/tests.yml
    with:
      project: browser
      shard: ${{ matrix.shard }}
